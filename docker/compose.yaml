# The delivery system, as it will run on a host.
#
# `docker compose up` from the repository root:
#     docker compose -f docker/compose.yaml up --build
#
# There is no `version:` key. It has been ignored by Compose v2 for years and
# only ever produces a warning.

name: jiranisokotech

# How much log each container keeps, which is the application logs' retention (section 53):
# they never reach the database, so the retention settings page cannot govern them. Docker's
# default keeps every line for ever, and a busy log fills the disk the database lives on.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: "${LOG_MAX_FILES:-10}"

services:
  web:
    logging: *logging
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # Production unless this host is deliberately something else. Staging gets the same
      # pipeline and a banner on every page saying it is not the live system; see
      # EnvironmentBanner and the appsettings file for each environment.
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      # Composed from the parts below so the password is never written twice,
      # and never inside a connection string committed to a file.
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-jiranisokotech};Username=${POSTGRES_USER:-jiranisokotech};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The first account, used once on an empty database and ignored ever
      # after. Left blank the application still starts; it simply has nobody
      # who can sign in, and says so in the log.
      Bootstrap__OwnerEmail: ${OWNER_EMAIL:-}
      Bootstrap__OwnerPassword: ${OWNER_PASSWORD:-}
      Bootstrap__OwnerName: ${OWNER_NAME:-}
      # Mail. File by default, so nothing reaches a real person until somebody
      # sets MAIL_TRANSPORT=Smtp on purpose.
      Mail__Transport: ${MAIL_TRANSPORT:-File}
      # An absolute path on a volume. The default is relative, which lands inside
      # the image where the non-root user cannot write — see the Dockerfile.
      Mail__Directory: /mail
      Mail__Host: ${MAIL_HOST:-}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__Username: ${MAIL_USERNAME:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__FromAddress: ${MAIL_FROM_ADDRESS:-}
      Mail__FromName: ${MAIL_FROM_NAME:-Jiranisoko Tech Solutions}
      Mail__BaseAddress: ${MAIL_BASE_ADDRESS:-https://${ERP_DOMAIN:-erp.jiranisokotech.co.ke}}
      # The key ring that signs cookies, on a volume rather than in the
      # container. Without it every deploy signs the whole firm out.
      DataProtection__KeyRingPath: /keys
      # Attachments and CVs, on volumes for the same reason the keys are: a
      # deploy replaces the container, and a client's signed contract is not
      # something to lose on a Tuesday.
      Documents__Directory: /documents
      Cvs__Directory: /cvs
      # The secret a Git host signs its webhook deliveries with. Left unset the
      # application starts normally and answers every delivery with 503, which
      # tells the host to try again later rather than to give up — so setting
      # this afterwards does not cost the deliveries that arrived in between.
      Git__Providers__GitHub__Secret: ${GITHUB_WEBHOOK_SECRET:-}
      # The other three hosts, which the application has always understood and this file
      # never passed a secret for — so a GitLab repository could be connected and would then
      # answer every delivery with 503, for want of a line here.
      Git__Providers__GitLab__Secret: ${GITLAB_WEBHOOK_SECRET:-}
      Git__Providers__Bitbucket__Secret: ${BITBUCKET_WEBHOOK_SECRET:-}
      Git__Providers__AzureDevOps__Secret: ${AZURE_DEVOPS_WEBHOOK_SECRET:-}

      # Section 43. Blank turns caching off rather than breaking startup, so this file is the
      # only thing that has to change to run without Redis.
      Cache__Connection: ${CACHE_CONNECTION:-cache:6379}
      # The token a metrics collector presents. Left unset the /metrics endpoint is not
      # mounted at all, rather than mounted and refusing — an endpoint that exists and
      # always answers 401 tells a prober that metrics are here and a token is worth
      # looking for. The counters describe the business: how many people sign in, how
      # many invoices go out, when the firm is busy.
      Metrics__Token: ${METRICS_TOKEN:-}
      # The AI features: the assistant, project readings and the recruitment aids. Blank means
      # off — every AI page says it is not configured and nothing is sent. Set, it means the
      # records a question looks up are sent to Anthropic to be read; docs/ai.md says exactly
      # which. The model and the daily allowance per person have defaults and rarely need setting.
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-claude-opus-5}
      Ai__DailyLimit: ${AI_DAILY_LIMIT:-40}
      # The networks a proxy may send X-Forwarded-For from, if there is one.
      # Left unset the application reads the address it can see, which behind a
      # proxy is the proxy — see ReverseProxy.cs for why that is not simply
      # trusted by default.
      Proxy__TrustedNetworks__0: ${PROXY_NETWORK:-}
    volumes:
      - keys:/keys
      - documents:/documents
      - cvs:/cvs
      # So that what the file transport "sent" survives a deploy and can be read
      # afterwards. It is only reached when no SMTP host is configured, which is
      # every environment that has not been pointed at a real one yet.
      - mail:/mail
    ports:
      # Bound to localhost. The reverse proxy in front of this is what the
      # internet talks to; the application itself is never directly exposed.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        # Not merely "started". Postgres accepts connections a moment after the
        # container is up, and a web process that starts in that gap dies on its
        # first query.
        condition: service_healthy
      cache:
        # Started is enough, unlike the database. The cache degrades to computing
        # the answer when it cannot be reached, so a web process that comes up a
        # moment early serves the truth slowly rather than failing.
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  db:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jiranisokotech}
      POSTGRES_USER: ${POSTGRES_USER:-jiranisokotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Without this the database is created with the host's locale, and text
      # ordering changes under you on a different machine.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-001"
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data. The 18 images store
      # the cluster in a version-named subdirectory so that pg_upgrade --link
      # can work across a single mount, and they refuse to start — not warn,
      # refuse — if they find a volume mounted at the old path instead.
      - db-data:/var/lib/postgresql
    # No ports. Nothing outside this network needs to reach the database, and
    # publishing 5432 to the host is how a database ends up on the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jiranisokotech} -d ${POSTGRES_DB:-jiranisokotech}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # The reverse proxy, which terminates TLS and obtains its own certificate. Only started
  # with --profile proxy, because a host that already runs nginx or a load balancer in
  # front of its containers must not have a second thing trying to bind 80 and 443.
  # See docker/Caddyfile and docs/deployment.md.
  proxy:
    logging: *logging
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:-erp.jiranisokotech.co.ke}
      # Never blank. Caddy refuses to start on an email option with nothing after it, which
      # was found by running it, so an unset value falls back to the firm's own mailbox.
      ACME_EMAIL: ${ACME_EMAIL:-delivery@jiranisokotech.co.ke}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 rides on UDP 443. Without this line browsers try it, fail, and fall back,
      # which works and wastes a round trip on every first visit.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account. On a volume, because Let's Encrypt limits how
      # many certificates one name may be issued a week, and a proxy that loses its
      # certificate on every restart can lock the domain out of HTTPS for days.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  cache:
    logging: *logging
    image: redis:8-alpine
    restart: unless-stopped
    # Persistence on, because this will hold background job state as well as
    # cache, and losing a queue on restart is not the same as losing a cache.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Section 88. Not a long-running service: the host's scheduler starts it, it writes one
  # backup and exits, and its exit status is the only report it gives — so a timer that
  # watches the status is what makes a failure visible. See docs/backups.md.
  #
  #     docker compose run --rm backup
  #
  # The database's own image, not a smaller one with a PostgreSQL client in it. pg_dump
  # refuses to dump a server newer than itself, so a client image left one major version
  # behind turns every nightly backup into an error the day the database is upgraded; this
  # image and db's move together because they are the same line.
  backup:
    logging: *logging
    image: postgres:18-alpine
    profiles: ["backup"]
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-jiranisokotech}
      PGUSER: ${POSTGRES_USER:-jiranisokotech}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_TO: /backups/data
      KEYS_BACKUP_TO: /backups/keys
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # Run with sh rather than executed, so the script needs no executable bit — which a
      # checkout on Windows does not keep.
      - ./backup.sh:/scripts/backup.sh:ro
      # Read-only. A backup has no business writing to what it backs up, and a script
      # mistake that did would be writing to the only copy.
      - documents:/documents:ro
      - cvs:/cvs:ro
      - keys:/keys:ro
      # Two host directories, never one: the key ring decrypts every second factor and
      # webhook secret the database holds, so a single copy holding both undoes the
      # encryption. backup.sh refuses to run if these turn out to be the same place.
      - ${BACKUP_DIRECTORY:-/var/backups/jiranisokotech/data}:/backups/data
      - ${KEYS_BACKUP_DIRECTORY:-/var/backups/jiranisokotech-keys}:/backups/keys
    depends_on:
      db:
        condition: service_healthy

  # The same, the other way. Given the backup to restore as arguments, paths inside this
  # container; docs/disaster-recovery.md has the whole procedure, which starts with stopping
  # web so that nothing writes while this does.
  #
  #     docker compose run --rm restore /backups/data/<stamp> /backups/keys/<stamp>
  #
  # The volumes are writable here, which is why this is a separate service rather than an
  # option on backup: the nightly job can then never be the thing that overwrites them.
  restore:
    logging: *logging
    image: postgres:18-alpine
    profiles: ["restore"]
    entrypoint: ["sh", "/scripts/restore.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-jiranisokotech}
      PGUSER: ${POSTGRES_USER:-jiranisokotech}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Not PGDATABASE: that is the one being replaced, and it cannot be dropped while
      # this is connected to it. Every PostgreSQL cluster has a database called postgres.
      MAINTENANCE_DATABASE: postgres
    volumes:
      - ./restore.sh:/scripts/restore.sh:ro
      - documents:/documents
      - cvs:/cvs
      - keys:/keys
      - ${BACKUP_DIRECTORY:-/var/backups/jiranisokotech/data}:/backups/data:ro
      - ${KEYS_BACKUP_DIRECTORY:-/var/backups/jiranisokotech-keys}:/backups/keys:ro
    depends_on:
      db:
        condition: service_healthy

# A fixed range for the containers' own network, so that the one address range the
# application should believe X-Forwarded-For from can be written down in advance: with the
# bundled proxy, PROXY_NETWORK is this range. Chosen well away from Docker's own default
# pools; change APP_SUBNET only if it collides with a network the host already has.
networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.80.0/24}

volumes:
  caddy-data:
  caddy-config:
  db-data:
  cache-data:
  keys:
  documents:
  cvs:
  mail:
